services:
  backend:
    build: ./backend
    container_name: ada-backend
    ports:
      - "8000:8000"
    volumes:
      - backend_reports:/app/reports_output
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ada-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_reports:
